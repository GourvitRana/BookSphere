<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to BookSphere - your digital library, organized.">
  <title>Sign in &middot; BookSphere</title>
  <script>(function(){try{var t=localStorage.getItem('booksphere-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="login">

  <div class="app-bg" aria-hidden="true">
    <div class="orb orb--amber"></div>
    <div class="orb orb--violet"></div>
    <div class="grid-haze"></div>
  </div>

  <main class="auth-page">
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <div class="auth-card animate-in">

      <a class="auth-brand" href="#" aria-label="BookSphere home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M6 8.5C6 6.57 7.57 5 9.5 5H16v20H9.5A3.5 3.5 0 0 1 6 21.5v-13Z" fill="url(#g-brand)"/>
            <path d="M26 8.5C26 6.57 24.43 5 22.5 5H16v20h6.5a3.5 3.5 0 0 0 3.5-3.5v-13Z" fill="url(#g-brand2)"/>
            <rect x="15.1" y="25" width="1.8" height="3" rx="0.9" fill="url(#g-brand2)"/>
            <defs>
              <linearGradient id="g-brand" x1="6" y1="5" x2="16" y2="25" gradientUnits="userSpaceOnUse">
                <stop stop-color="#c8a24c"/><stop offset="1" stop-color="#b8893a"/>
              </linearGradient>
              <linearGradient id="g-brand2" x1="16" y1="5" x2="26" y2="25" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4a9e8d"/><stop offset="1" stop-color="#3f8d7c"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">BookSphere</span>
          <span class="brand-tagline">Your digital library, organized.</span>
        </span>
      </a>

      <div class="auth-heading">
        <h1>Welcome back</h1>
        <p>Sign in to open your library.</p>
      </div>

      <p class="auth-banner" id="loginBanner" role="status" hidden></p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="Your password">
        </div>

        <p class="form-error" id="loginError" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">
          <span class="btn-label">Sign in</span>
        </button>
      </form>

      <p class="auth-switch">
        New to BookSphere? <a href="register.html">Create an account</a>
      </p>
    </div>
  </main>

  <script src="js/shared.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
